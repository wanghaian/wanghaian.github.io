</main><script>
const button = document.querySelector('.tart');
const tart = button.querySelector('img');
button.addEventListener('click', () => {
  tart.getAnimations().forEach(animation => animation.cancel());
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frames = reduced
    ? [{ opacity: 0.7 }, { opacity: 1 }]
    : [0, -14, 12, -8, 5, 0].map(angle => ({ transform: 'rotate(' + angle + 'deg)' }));
  tart.animate(frames, { duration: reduced ? 150 : 550, easing: 'ease-out' });
});
